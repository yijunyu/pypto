repos:

    # Common
    - repo: local
      hooks:
        - id: check-headers
          name: check-headers
          entry: python tests/lint/check_headers.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-no-foreign-targets
          name: check-no-foreign-targets
          entry: python rust/tests/lint/check_no_foreign_targets.py
          language: python
          language_version: python3
          pass_filenames: false

        # The corpus `.tile` captures are hand-written MLIR, and nothing was
        # comparing their calls to the intrinsics tile_std declares. Three did
        # not match; one of the three had CORRECT arity and every operand
        # shifted by one, which is why this reads the declaration rather than
        # counting commas.
        - id: check-call-conformance
          name: check-call-conformance
          entry: python rust/bench/shapes/check_call_conformance.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-english-only
          name: check-english-only
          entry: python rust/lint/check_english_only.py
          language: python
          language_version: python3
          pass_filenames: false
          exclude: ^(3rdparty/|docs/zh/|README\.zh-CN\.md)

        - id: check-docs-en-zh-parity
          name: check-docs-en-zh-parity
          entry: python tests/lint/check_docs_en_zh_parity.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-docs-nav
          name: check-docs-nav
          entry: python tests/lint/check_docs_nav.py
          language: python
          language_version: python3
          additional_dependencies: [pyyaml]
          pass_filenames: false

        - id: check-docs-symbol-coverage
          name: check-docs-symbol-coverage
          entry: python tests/lint/check_docs_symbol_coverage.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-no-broad-raises
          name: check-no-broad-raises
          entry: python tests/lint/check_no_broad_raises.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-environment-inputs
          name: check-environment-inputs
          entry: python tests/lint/check_environment_inputs.py
          language: python
          language_version: python3.10
          pass_filenames: false

        - id: check-emitter-check-classification
          name: check-emitter-check-classification
          entry: python tests/lint/check_emitter_check_classification.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-op-name-literals
          name: check-op-name-literals
          entry: python tests/lint/check_op_name_literals.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-function-attr-key-parity
          name: check-function-attr-key-parity
          entry: python tests/lint/check_function_attr_key_parity.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-op-docstring-parity
          name: check-op-docstring-parity
          entry: python tests/lint/check_op_docstring_parity.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-ir-property-parity
          name: check-ir-property-parity
          entry: python tests/lint/check_ir_property_parity.py
          language: python
          language_version: python3
          pass_filenames: false

        - id: check-property-set-doc-parity
          name: check-property-set-doc-parity
          entry: python tests/lint/check_property_set_doc_parity.py
          language: python
          language_version: python3
          pass_filenames: false

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
        - id: check-added-large-files
          exclude: ^docs/assets/
        - id: check-yaml
        - id: end-of-file-fixer
        - id: trailing-whitespace

    # C++ linting
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v21.1.0
      hooks:
        - id: clang-format
          types_or: [c++, c]
          # GENERATED artifacts are excluded alongside `3rdparty/`, and for the
          # same reason: neither is this projects to format.
          #
          # `rust/bench/*/ascendc/` is AscendC emitted by `pto-to-ascendc`, and
          # `tests/fixtures/*.cpp` is output captured from `ptoas`. Three things
          # cannot all hold at once: the emitter produces a specific text, a
          # byte-identity test asserts the committed file equals freshly-emitted
          # output, and clang-format wants to reformat it. Measured: letting it
          # run rewrote all 29 bench files and one fixture, and the identity gate
          # failed immediately.
          #
          # Bending the emitter to a HOST C++ style guide would be the wrong
          # resolution -- its output format is settled by what bisheng accepts
          # and by the gate that pins it, not by this repositorys braces.
          exclude: ^(3rdparty/|rust/bench/[^/]+/ascendc/|rust/crates/ptoas_rs/tests/fixtures/.*\.cpp$)

    - repo: https://github.com/cpplint/cpplint
      rev:  2.0.0
      hooks:
        - id: cpplint
          # Same scope as clang-format above, same reason. cpplints findings on
          # the generated corpus are properties of the EMITTER -- C-style casts
          # and an unqualified `#include` -- and are answered by changing the
          # emitter if they are worth answering at all, not by editing an
          # artifact a test regenerates.
          exclude: ^(3rdparty/|rust/bench/[^/]+/ascendc/|rust/crates/ptoas_rs/tests/fixtures/.*\.cpp$)
          args:
            - --root=include
            - --linelength=110
            - --filter=-whitespace/parens,-whitespace/indent_namespace,-runtime/references

    # Markdown linting
    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.20.0
      hooks:
        - id: markdownlint-cli2
          args:
            - --fix
            - --config
            - tests/lint/.markdownlint.yaml

    # Python linting
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.14.8
      hooks:
        - id: ruff-check
          types_or: [python, pyi]
          args: [--fix]
          exclude: ^tests/ut/codegen/test_orchestration_codegen\.py$
        - id: ruff-format
          types_or: [python, pyi]

    - repo: https://github.com/RobertCraigie/pyright-python
      rev: v1.1.407
      hooks:
      - id: pyright
        # The project config (pyproject [tool.pyright]) is the single pyright
        # authority: strict by default, relaxed profiles for trees not yet
        # carried to the strict fixed point. Without this the hook receives
        # touched filenames and would check out-of-scope files under strict.
        pass_filenames: false
        additional_dependencies: [pytest==7.0.0, torch==2.8.0, numpy==2.0.0, PyYAML>=6.0]
